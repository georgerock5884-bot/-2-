<script>
/* ==================== CONFIG ==================== */
const GEOJSON_URL = "https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson";
const SOUND_ENABLED = false;
const AUTO_ADVANCE_MS_CORRECT = 1400;
const AUTO_ADVANCE_MS_WRONG = 2400;

/* dreamlo.com で作った自分のリーダーボードのコードに書き換えてください
   1. https://dreamlo.com/lb/ にアクセス（登録不要）
   2. リーダーボードを作成すると「Private Code」と「Public Code」が発行される
   3. 下の2行に貼り付ける（Private Codeは絶対に他人に教えないこと） */
const DREAMLO_PRIVATE_CODE = "YOUR_PRIVATE_CODE";
const DREAMLO_PUBLIC_CODE = "YOUR_PUBLIC_CODE";
const REGION_VIEW = window.WORLD_QUIZ_REGION_VIEW || {};
const FALLBACK_POINTS = window.WORLD_QUIZ_FALLBACK_POINTS || {};
const MODES = {
  easy:          { label:"初級",         count:15,  filter:c=>c.tier===1 },
  medium:        { label:"中級",         count:40,  filter:c=>c.tier===2 },
  advanced:      { label:"上級",         count:null, filter:c=>true },
  asia:          { label:"アジア編",     count:null, filter:c=>c.continent==="asia" },
  europe:        { label:"ヨーロッパ編", count:null, filter:c=>c.continent==="europe" },
  africa:        { label:"アフリカ編",   count:null, filter:c=>c.continent==="africa" },
  north_america: { label:"北アメリカ編", count:null, filter:c=>c.continent==="north_america" },
  south_america: { label:"南アメリカ編", count:null, filter:c=>c.continent==="south_america" },
  oceania:       { label:"オセアニア編", count:null, filter:c=>c.continent==="oceania" }
};
const CONTINENT_MODE_KEYS = ["asia","europe","africa","north_america","south_america","oceania"];
const HINT_PENALTY = 2;
function pointsForTime(t){
  if(t<=3) return 10;
  if(t<=5) return 8;
  if(t<=10) return 5;
  return 2;
}
function modeQuestionCount(modeKey, askCapital, format){
  const cfg = MODES[modeKey];
  const basePool = format==="map" ? playableCountries() : ALL_COUNTRIES;
  let pool = basePool.filter(cfg.filter);
  if(askCapital) pool = pool.filter(c=>c.capitals && c.capitals.length>0);
  return cfg.count ? Math.min(cfg.count, pool.length) : pool.length;
}
const MAP_COLORS = {
  dark:  { baseColor:"#2a3346", baseFill:"#1a2133", targetColor:"#e3c375", targetFill:"#e2493d" },
  light: { baseColor:"#c9c4b0", baseFill:"#e6e3d8", targetColor:"#a9822f", targetFill:"#c8362b" }
};

/* ==================== STATE ==================== */
let ALL_COUNTRIES = window.WORLD_QUIZ_COUNTRIES || [];
let GEO_LOAD_STATE = "idle"; // idle | loading | ready | error
let GEO_DATA = null;
let map = null, geoLayer = null, shiftedLayer = null, targetLayerRef = null, targetMarker = null;
let SHIFTED_FEATURES = [];
let layersByFeature = new Map();
let featureToCountry = new Map();
let pendingResume = false;

let state = { screen:"title" };
let quiz = null; // {difficulty, format, askCapital, answerMode, list, pool, index, results, streak, maxStreak, qStartTime, answered, showFlag}
let pendingDifficulty = null;
let pendingFormat = null;
let geoFetchPromise = null;

let FLAG_PREF = (function(){
  try{ return localStorage.getItem("wcq_flag_pref") !== "hide"; }catch(e){ return true; }
})();
function setFlagPref(show){
  FLAG_PREF = show;
  try{ localStorage.setItem("wcq_flag_pref", show ? "show" : "hide"); }catch(e){}
}
let QUIZ_TYPE_PREF = (function(){
  try{ return localStorage.getItem("wcq_quiz_type") === "capital" ? "capital" : "country"; }catch(e){ return "country"; }
})();
function setQuizTypePref(type){
  QUIZ_TYPE_PREF = type;
  try{ localStorage.setItem("wcq_quiz_type", type); }catch(e){}
}
let ANSWER_MODE_PREF = (function(){
  try{ return localStorage.getItem("wcq_answer_mode") === "choice4" ? "choice4" : "typing"; }catch(e){ return "typing"; }
})();
function setAnswerModePref(mode){
  ANSWER_MODE_PREF = mode;
  try{ localStorage.setItem("wcq_answer_mode", mode); }catch(e){}
}
let THEME = (function(){
  try{ return localStorage.getItem("wcq_theme") === "light" ? "light" : "dark"; }catch(e){ return "dark"; }
})();
document.documentElement.setAttribute("data-theme", THEME);
function setTheme(t){
  THEME = t;
  try{ localStorage.setItem("wcq_theme", t); }catch(e){}
  document.documentElement.setAttribute("data-theme", t);
  forEachMapLayer(l=>l.setStyle(baseStyle()));
  if(quiz && state.screen==="quiz" && GEO_LOAD_STATE==="ready"){ highlightAnswerOnMap(currentCountry()); }
  render();
}
let PLAYER_NAME = (function(){
  try{ return localStorage.getItem("wcq_player_name") || ""; }catch(e){ return ""; }
})();
function escapeHtml(s){
  return (s||"").toString().replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

/* ==================== UTIL ==================== */
function kataToHira(s){
  return s.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function normJa(s){
  const cleaned = (s||"")
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[\s　]+/g,"")
    .replace(/[・\-.,、。’']/g,"");
  return kataToHira(cleaned);
}
function normName(s){
  return (s||"")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .trim();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){ return sec.toFixed(2)+"秒"; }
function fmtMinSec(totalSec){
  const m = Math.floor(totalSec/60), s = Math.round(totalSec - m*60);
  return m>0 ? `${m}分${s}秒` : `${s}秒`;
}
function go(next){ state = {...state, ...(next||{})}; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ==================== SOUND (WebAudio, no external files) ==================== */
let actx = null;
function beep(freqStart, freqEnd, dur, type){
  if(!SOUND_ENABLED) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freqStart, actx.currentTime);
    osc.frequency.linearRampToValueAtTime(freqEnd, actx.currentTime+dur);
    gain.gain.setValueAtTime(0.001, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, actx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime+dur+0.02);
  }catch(e){ /* audio not available — silently ignore */ }
}
function playCorrectSound(){ beep(520,880,0.25,"triangle"); }
function playWrongSound(){ beep(220,110,0.32,"sawtooth"); }

/* ==================== LOCAL BEST SCORES ==================== */
function bestKey(diff, askCapital, format, answerMode){
  return "wcq_best_"+diff+(askCapital?"_cap":"")+"_"+(format==="flag"?"flag":"map")+"_"+(answerMode==="choice4"?"c4":"ty");
}
function getBest(diff, askCapital, format, answerMode){
  try{ return JSON.parse(localStorage.getItem(bestKey(diff, askCapital, format, answerMode))||"null"); }catch(e){ return null; }
}
function saveBestIfBetter(diff, askCapital, format, answerMode, summary){
  const prev = getBest(diff, askCapital, format, answerMode);
  let isNew = false;
  if(!prev || summary.accuracy > prev.accuracy || (summary.accuracy===prev.accuracy && summary.avgTime < prev.avgTime)){
    try{ localStorage.setItem(bestKey(diff, askCapital, format, answerMode), JSON.stringify(summary)); }catch(e){}
    isNew = true;
  }
  return isNew;
}
function getMaxStreak(){
  try{ return parseInt(localStorage.getItem("wcq_max_streak")||"0",10); }catch(e){ return 0; }
}
function saveMaxStreak(v){
  const cur = getMaxStreak();
  if(v>cur){ try{ localStorage.setItem("wcq_max_streak", String(v)); }catch(e){} return true; }
  return false;
}

/* ==================== LIFETIME STATS (マイページ) ==================== */
function getLifetimeStats(){
  const empty = { totalPoints:0, totalTime:0, totalCorrect:0, totalWrong:0, totalQuestions:0 };
  try{ return JSON.parse(localStorage.getItem("wcq_lifetime")||"null") || empty; }catch(e){ return empty; }
}
function updateLifetimeStats(summary){
  const s = getLifetimeStats();
  s.totalPoints += summary.totalScore;
  s.totalTime += summary.totalTime;
  s.totalCorrect += summary.correctCount;
  s.totalWrong += (summary.total - summary.correctCount);
  s.totalQuestions += summary.total;
  try{ localStorage.setItem("wcq_lifetime", JSON.stringify(s)); }catch(e){}
  return s;
}

/* ==================== GEO DATA LOADING & MATCHING ==================== */
function loadGeoData(){
  if(geoFetchPromise) return geoFetchPromise;
  GEO_LOAD_STATE = "loading";
  render();
  geoFetchPromise = (async ()=>{
    try{
      const res = await fetch(GEOJSON_URL);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      if(!data || !Array.isArray(data.features) || data.features.length===0) throw new Error("empty geojson");
      GEO_DATA = data;
      resolveCountryFeatures();
      SHIFTED_FEATURES = buildShiftedPacificFeatures();
      GEO_LOAD_STATE = "ready";
    }catch(e){
      console.error("地図データの読み込みに失敗しました", e);
      GEO_LOAD_STATE = "error";
    }
    geoFetchPromise = null;
    if(GEO_LOAD_STATE==="ready" && pendingResume){
      pendingResume = false;
      resumeSavedQuiz();
    }else if(GEO_LOAD_STATE==="ready" && pendingDifficulty){
      const d = pendingDifficulty, f = pendingFormat || "map";
      pendingDifficulty = null; pendingFormat = null;
      startQuiz(d, f);
    }else{
      render();
    }
  })();
  return geoFetchPromise;
}

function resolveCountryFeatures(){
  const byA3 = {}, byName = {};
  featureToCountry = new Map();
  GEO_DATA.features.forEach(f=>{
    const p = f.properties || {};
    const a3 = p["ISO3166-1-Alpha-3"];
    const nm = normName(p.name);
    if(a3 && a3 !== "-99") byA3[a3] = f;
    if(nm && !byName[nm]) byName[nm] = f;
  });
  ALL_COUNTRIES.forEach(c=>{
    let f = byA3[c.a3];
    if(!f){
      const candidates = [c.en, ...(c.geoNames||[])];
      for(const cand of candidates){
        const nm = normName(cand);
        if(byName[nm]){ f = byName[nm]; break; }
      }
    }
    c._feature = f || null;
    if(f) featureToCountry.set(f, c);
    if(!f && !FALLBACK_POINTS[c.a3]) console.warn("地図データに一致する国が見つかりません（除外されます）:", c.ja, c.a3);
  });
}

function playableCountries(){
  return ALL_COUNTRIES.filter(c=>c._feature || FALLBACK_POINTS[c.a3]);
}

/* ==================== QUIZ SETUP ==================== */
function buildQuestionList(modeKey, askCapital, format){
  const cfg = MODES[modeKey];
  const basePool = format==="map" ? playableCountries() : ALL_COUNTRIES.slice();
  let pool = basePool.filter(cfg.filter);
  if(askCapital) pool = pool.filter(c=>c.capitals && c.capitals.length>0);
  const list = cfg.count ? shuffle(pool).slice(0, Math.min(cfg.count, pool.length)) : shuffle(pool);
  return { list, pool };
}

function buildChoicesFor(c){
  const correctText = quiz.askCapital ? (c.capitals && c.capitals[0]) : c.ja;
  const decoyCandidates = shuffle(quiz.pool.filter(x=>x!==c));
  const decoys = [];
  for(const d of decoyCandidates){
    const label = quiz.askCapital ? (d.capitals && d.capitals[0]) : d.ja;
    if(label && label!==correctText && !decoys.includes(label)) decoys.push(label);
    if(decoys.length>=3) break;
  }
  return { options: shuffle([correctText, ...decoys]), correctText };
}
function setCurrentChoices(){
  if(quiz.answerMode!=="choice4") return;
  const built = buildChoicesFor(currentCountry());
  quiz.currentChoices = built.options;
  quiz.currentCorrectChoice = built.correctText;
}

function startQuiz(modeKey, format){
  const askCapital = QUIZ_TYPE_PREF === "capital";
  const answerMode = ANSWER_MODE_PREF;
  const { list, pool } = buildQuestionList(modeKey, askCapital, format);
  quiz = {
    difficulty: modeKey,
    format,
    askCapital,
    answerMode,
    list,
    pool,
    index: 0,
    results: [],
    streak: 0,
    maxStreak: 0,
    qStartTime: performance.now(),
    answered: false,
    showFlag: FLAG_PREF,
    hintsUsed: 0
  };
  setCurrentChoices();
  go({ screen:"quiz" });
}

function currentCountry(){ return quiz.list[quiz.index]; }

function targetAnswerString(c){
  return quiz.askCapital ? (c.capitals && c.capitals[0]) : c.ja;
}
function maxHintsFor(c){
  const target = targetAnswerString(c);
  if(!target) return 0;
  return Math.max(0, Array.from(target).length - 1);
}
function useHint(){
  if(!quiz || quiz.answered || quiz.paused || quiz.answerMode==="choice4") return;
  const c = currentCountry();
  const max = maxHintsFor(c);
  if(quiz.hintsUsed >= max) return;
  quiz.hintsUsed += 1;
  updateHintDisplay();
}
function updateHintDisplay(){
  if(!quiz || quiz.answerMode==="choice4") return;
  const c = currentCountry();
  const target = targetAnswerString(c);
  const el = document.getElementById("hintDisplay");
  const btn = document.getElementById("hintBtn");
  if(!target || !el || !btn) return;
  const chars = Array.from(target);
  const max = maxHintsFor(c);
  const shown = chars.map((ch,i)=> i < quiz.hintsUsed ? ch : "・").join("");
  el.textContent = quiz.hintsUsed>0 ? shown : "";
  const remaining = Math.max(0, max - quiz.hintsUsed);
  btn.disabled = quiz.answered || remaining<=0;
  btn.textContent = `ヒント（-${HINT_PENALTY}pt）残り${remaining}回`;
}

/* ==================== ANSWERING ==================== */
function markChoiceButtons(selectedValue){
  const correctText = quiz.currentCorrectChoice;
  document.querySelectorAll(".choice-btn").forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.value === correctText) btn.classList.add("correct");
    else if(btn.dataset.value === selectedValue) btn.classList.add("wrong");
  });
}

function checkAnswer(selectedValue){
  if(!quiz || quiz.answered || quiz.paused) return;
  const isChoice = quiz.answerMode === "choice4";
  let raw;
  if(isChoice){
    raw = selectedValue;
  }else{
    const input = document.getElementById("answerInput");
    raw = input.value;
  }
  const val = normJa(raw);
  if(!val){
    if(!isChoice){
      const input = document.getElementById("answerInput");
      input.classList.add("wrong");
      setTimeout(()=>input.classList.remove("wrong"), 300);
    }
    return;
  }
  const c = currentCountry();
  const answerPool = quiz.askCapital ? (c.capitals||[]) : [c.ja, ...(c.aliases||[])];
  const candidates = answerPool.map(normJa);
  const correct = candidates.includes(val);
  const elapsed = (performance.now() - quiz.qStartTime)/1000;
  const rawPoints = isChoice ? Math.round(pointsForTime(elapsed)/2) : pointsForTime(elapsed);
  const points = correct ? Math.max(0, rawPoints - quiz.hintsUsed*HINT_PENALTY) : 0;

  quiz.answered = true;
  quiz.results.push({ country:c, correct, time:elapsed, points, hints:quiz.hintsUsed });
  if(correct){
    quiz.streak += 1;
    quiz.maxStreak = Math.max(quiz.maxStreak, quiz.streak);
    playCorrectSound();
  }else{
    quiz.streak = 0;
    playWrongSound();
  }
  if(isChoice){
    markChoiceButtons(selectedValue);
  }else{
    const input = document.getElementById("answerInput");
    input.disabled = true;
    if(!correct) input.classList.add("wrong");
    const answerBtn = document.getElementById("answerBtn");
    if(answerBtn) answerBtn.disabled = true;
    const hintBtn = document.getElementById("hintBtn");
    if(hintBtn) hintBtn.disabled = true;
  }
  showFeedback(correct, c, elapsed, points);
  if(quiz.format==="map") highlightAnswerOnMap(c);
  scheduleAutoAdvance(correct);
}

function showFeedback(correct, c, elapsed, points){
  const panel = document.getElementById("feedback");
  panel.className = "feedback-panel show " + (correct ? "ok":"ng");
  const correctAnswerLabel = quiz.askCapital ? (c.capitals && c.capitals[0]) : c.ja;
  const subLabel = quiz.askCapital ? `（${c.ja}の首都）` : "";
  const pointsLabel = correct ? `　獲得ポイント: +${points}pt` : "";
  panel.innerHTML = `
    <img src="https://flagcdn.com/w160/${c.a2}.png" onerror="this.replaceWith(flagFallbackEl('${c.a2}', true))" alt="${c.ja}の国旗">
    <div class="txt">
      <b>${correct ? "正解！" : "不正解"} — ${correctAnswerLabel}${subLabel}</b>
      <div>回答タイム: ${fmtTime(elapsed)}${pointsLabel}${correct ? "" : "　正解は「"+correctAnswerLabel+"」でした"}</div>
      <div class="advance-note">${quiz.index < quiz.list.length-1 ? "まもなく次の問題へ…" : "まもなく結果画面へ…"}</div>
    </div>
  `;
}

let autoAdvanceHandle = null;
function scheduleAutoAdvance(correct){
  if(autoAdvanceHandle) clearTimeout(autoAdvanceHandle);
  const delay = correct ? AUTO_ADVANCE_MS_CORRECT : AUTO_ADVANCE_MS_WRONG;
  autoAdvanceHandle = setTimeout(()=>{
    autoAdvanceHandle = null;
    if(quiz && quiz.answered && !quiz.paused && state.screen==="quiz"){ nextQuestion(); }
  }, delay);
}

function flagFallbackEl(a2, small){
  const span = document.createElement("span");
  span.className = "flag-fallback" + (small ? " small" : "");
  span.textContent = (a2||"").toUpperCase();
  return span;
}
window.flagFallbackEl = flagFallbackEl;

function nextQuestion(){
  if(quiz.index < quiz.list.length - 1){
    quiz.index += 1;
    quiz.answered = false;
    quiz.hintsUsed = 0;
    quiz.qStartTime = performance.now();
    setCurrentChoices();
    render();
  }else{
    finishQuiz();
  }
}

function finishQuiz(){
  const results = quiz.results;
  const correctCount = results.filter(r=>r.correct).length;
  const total = results.length;
  const accuracy = total ? (correctCount/total*100) : 0;
  const times = results.map(r=>r.time);
  const totalTime = times.reduce((a,b)=>a+b,0);
  const avgTime = total ? totalTime/total : 0;
  const bestTime = times.length ? Math.min(...times) : 0;
  const totalScore = results.reduce((a,r)=>a+(r.points||0),0);

  const summary = {
    correctCount, total, accuracy, avgTime, bestTime, totalTime, totalScore,
    date: new Date().toISOString()
  };
  const isNewBest = saveBestIfBetter(quiz.difficulty, quiz.askCapital, quiz.format, quiz.answerMode, summary);
  const isNewStreak = saveMaxStreak(quiz.maxStreak);
  updateLifetimeStats(summary);

  go({ screen:"result", lastSummary: summary, lastIsNewBest: isNewBest, lastIsNewStreak: isNewStreak, lastMaxStreak: quiz.maxStreak });
}

function rankOf(accuracy){
  if(accuracy>=95) return "S";
  if(accuracy>=85) return "A";
  if(accuracy>=70) return "B";
  if(accuracy>=50) return "C";
  return "D";
}

/* ==================== ONLINE RANKING (dreamlo) ==================== */
function rankingModeKey(){
  return quiz.difficulty + "|" + (quiz.askCapital ? "capital" : "country") + "|" + quiz.format + "|" + quiz.answerMode;
}
function modeLabel(modeKey){
  const [diff, type, format, am] = (modeKey||"").split("|");
  const base = MODES[diff] ? MODES[diff].label : diff;
  return base + (type==="capital" ? "・首都" : "") + (format==="flag" ? "・国旗" : "・地図") + (am==="choice4" ? "・4択" : "");
}
async function submitScoreToDreamlo(modeKey, score, seconds){
  const rawName = PLAYER_NAME.trim().slice(0,16);
  const uniqueName = encodeURIComponent(`${rawName}::${modeKey}`);
  const url = `https://www.dreamlo.com/lb/${DREAMLO_PRIVATE_CODE}/add/${uniqueName}/${Math.max(0,Math.round(score))}/${Math.max(0,Math.round(seconds))}/${encodeURIComponent(modeKey)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("dreamlo submit failed: HTTP "+res.status);
}
async function fetchDreamloEntries(modeKey){
  const res = await fetch(`https://www.dreamlo.com/lb/${DREAMLO_PUBLIC_CODE}/json`);
  if(!res.ok) throw new Error("dreamlo fetch failed: HTTP "+res.status);
  const data = await res.json();
  let raw = data && data.dreamlo && data.dreamlo.leaderboard ? data.dreamlo.leaderboard.entry : null;
  if(!raw) raw = [];
  if(!Array.isArray(raw)) raw = [raw];
  return raw
    .filter(e => e && e.text === modeKey)
    .map(e => ({
      displayName: (e.name || "").split("::")[0],
      score: parseInt(e.score, 10) || 0,
      seconds: parseInt(e.seconds, 10) || 0
    }))
    .sort((a,b)=> b.score - a.score)
    .slice(0, 20);
}
async function showRanking(){
  if(!quiz || !state.lastSummary) return;
  if(!PLAYER_NAME || !PLAYER_NAME.trim()){
    const nameInput = document.getElementById("playerNameInput");
    if(nameInput) nameInput.focus();
    alert("画面左上で名前を入力してから、もう一度ランキングボタンを押してください。");
    return;

/* ==================== MAP ==================== */
function forEachMapLayer(fn){
  if(geoLayer) geoLayer.eachLayer(fn);
  if(shiftedLayer) shiftedLayer.eachLayer(fn);
}

// 日付変更線の東側（西経表記）にある太平洋の島々（サモア・トンガなど）は、そのままだと
// オセアニア表示の東端に出てこない。+360度ずらしたコピーを別レイヤーとして描いて見えるようにする。
function buildShiftedPacificFeatures(){
  const out = [];
  GEO_DATA.features.forEach(f=>{
    const g = f.geometry;
    if(!g) return;
    let polys;
    if(g.type==="Polygon") polys = [g.coordinates];
    else if(g.type==="MultiPolygon") polys = g.coordinates;
    else return;
    const shifted = [];
    polys.forEach(poly=>{
      const ring = poly[0];
      if(!ring || !ring.length) return;
      let maxLng=-Infinity, minLat=Infinity, maxLat=-Infinity;
      for(let i=0;i<ring.length;i++){
        const x = ring[i][0], y = ring[i][1];
        if(x>maxLng) maxLng=x;
        if(y<minLat) minLat=y;
        if(y>maxLat) maxLat=y;
      }
      if(maxLng <= -140 && minLat >= -60 && maxLat <= 35){
        shifted.push(poly.map(r=>r.map(pt=>[pt[0]+360, pt[1]])));
      }
    });
    if(shifted.length){
      out.push({ type:"Feature", properties:f.properties, geometry:{ type:"MultiPolygon", coordinates:shifted }, _orig:f });
    }
  });
  return out;
}

function ensureMap(clickHandler){
  const container = document.getElementById("map");
  if(!container) return;
  if(map){ map.remove(); map = null; }
  geoLayer = null; shiftedLayer = null; targetMarker = null;
  layersByFeature = new Map();
  map = L.map("map", {
    zoomControl:false,
    attributionControl:false,
    minZoom:1, maxZoom:8,
    zoomSnap:0.1, zoomDelta:0.5,
    worldCopyJump:false,
    maxBounds:[[-95,-210],[95,430]]
  });
  L.control.zoom({position:"bottomright"}).addTo(map);

  geoLayer = L.geoJSON(GEO_DATA, {
    style: baseStyle,
    interactive: !!clickHandler,
    onEachFeature: (feature, layer)=>{
      layer._wcqFeature = feature;
      registerLayer(feature, layer);
      if(clickHandler) layer.on("click", ()=>clickHandler(feature));
    }
  }).addTo(map);

  if(SHIFTED_FEATURES.length){
    shiftedLayer = L.geoJSON(SHIFTED_FEATURES, {
      style: baseStyle,
      interactive:false,
      onEachFeature: (feature, layer)=>{ layer._wcqFeature = feature._orig; registerLayer(feature._orig, layer); }
    }).addTo(map);
  }

  try{
    map.fitBounds([[-58,-180],[80,180]], { padding:[6,6], animate:false });
  }catch(e){
    map.setView([15,10], 2, { animate:false });
  }
}

const COUNTRY_VIEW_OVERRIDE = {
  // ロシアは大陸区分上ヨーロッパ寄りだが国土が東西に非常に広いため専用の表示範囲を使う
  RUS: { bounds: [[41, 19], [82, 180]] }
};
function zoomToRegion(country){
  if(!map) return;
  const override = country && COUNTRY_VIEW_OVERRIDE[country.a3];
  const v = override || (country && (REGION_VIEW[country.region] || REGION_VIEW[country.continent]));
  try{
    if(v && v.bounds) map.fitBounds(v.bounds, { padding:[10,10], animate:false });
    else if(v && v.center) map.setView(v.center, v.zoom || 3, { animate:false });
    else map.fitBounds([[-58,-180],[80,180]], { padding:[6,6], animate:false });
  }catch(e){}
}

function baseStyle(){
  const m = MAP_COLORS[THEME] || MAP_COLORS.dark;
  return { color:m.baseColor, weight:0.7, fillColor:m.baseFill, fillOpacity:1 };
}
function targetStyle(){
  const m = MAP_COLORS[THEME] || MAP_COLORS.dark;
  return { color:m.targetColor, weight:1.6, fillColor:m.targetFill, fillOpacity:0.92 };
}

// 現在の表示倍率で、国全体の見た目の面積（px^2）がこの値より小さければ「小さい国」として丸で囲む
const SMALL_COUNTRY_AREA_PX = 2000;

function outerRingsOf(layer){
  const ll = layer.getLatLngs();
  const rings = [];
  if(!ll || !ll.length) return rings;
  const isMulti = Array.isArray(ll[0]) && Array.isArray(ll[0][0]);
  if(isMulti){ ll.forEach(poly=>{ if(poly && poly[0]) rings.push(poly[0]); }); }
  else if(ll[0]) rings.push(ll[0]);
  return rings;
}
function ringBounds(ring){
  let minLat=90, maxLat=-90, minLng=1e9, maxLng=-1e9;
  for(let i=0;i<ring.length;i++){
    const p = ring[i];
    if(p.lat<minLat) minLat=p.lat;
    if(p.lat>maxLat) maxLat=p.lat;
    if(p.lng<minLng) minLng=p.lng;
    if(p.lng>maxLng) maxLng=p.lng;
  }
  return L.latLngBounds([minLat,minLng],[maxLat,maxLng]);
}
function clearTargetMarker(){
  if(targetMarker && map){ map.removeLayer(targetMarker); }
  targetMarker = null;
}
function placeTargetMarker(latlng, filled){
  const m = MAP_COLORS[THEME] || MAP_COLORS.dark;
  const layers = [];
  if(filled){
    layers.push(L.circleMarker(latlng, {
      radius:6, color:m.targetColor, weight:1.5, fillColor:m.targetFill, fillOpacity:1,
      className:"country-target", interactive:false
    }));
  }
  layers.push(L.circleMarker(latlng, {
    radius:26, color:m.targetColor, weight:2, fill:false,
    dashArray:"4 5", className:"small-country-ring", interactive:false
  }));
  targetMarker = L.layerGroup(layers).addTo(map);
}

function highlightAnswerOnMap(country){
  if(!geoLayer || !map) return;
  const feature = country && country._feature;
  const matches = [];
  forEachMapLayer(l=>{
    l.setStyle(baseStyle());
    if(l._path) l._path.classList.remove("country-target");
    if(feature && l._wcqFeature === feature) matches.push(l);
  });
  clearTargetMarker();

  matches.forEach(l=>{
    l.setStyle(targetStyle());
    l.bringToFront();
    if(l._path) l._path.classList.add("country-target");
    targetLayerRef = l;
  });

  // 表示中の範囲にある国土の面積合計と、いちばん大きい国土の位置を求める
  let total = 0, best = null;
  const view = map.getBounds();
  matches.forEach(l=>{
    outerRingsOf(l).forEach(ring=>{
      if(!ring.length) return;
      const b = ringBounds(ring);
      const sw = map.latLngToContainerPoint(b.getSouthWest());
      const ne = map.latLngToContainerPoint(b.getNorthEast());
      const area = Math.abs(ne.x - sw.x) * Math.abs(sw.y - ne.y);
      total += area;
      const c = b.getCenter();
      if(view.contains(c) && (!best || area > best.area)) best = { c, area };
    });
  });

  const fp = country && FALLBACK_POINTS[country.a3];
  if(!best){
    // 地図データに形が無い、または表示範囲に入っていない場合は予備座標に印を出す
    if(fp) placeTargetMarker(L.latLng(fp[0], fp[1]), true);
  }else if(total < SMALL_COUNTRY_AREA_PX){
    placeTargetMarker(best.c, false);
  }
}

      body = `<div class="ranking-list">` + entries.map((e,i)=>{
        const mine = e.displayName === myName;
        return `<div class="ranking-row ${mine?"mine":""}">
          <div class="rk-pos">${i+1}</div>
          <div class="rk-name">${escapeHtml(e.displayName)}</div>
          <div class="rk-score">${e.score}pt</div>
        </div>`;
      }).join("") + `</div>`;
    }
  }
  return `
  <div class="result">
    <p class="eyebrow">RANKING — ${label}</p>
    <h2>ランキング</h2>
  </div>
  ${body}
  <div class="result-actions">
    <button class="btn btn-ghost" onclick="go({screen:'result'})">結果画面に戻る</button>
    <button class="btn btn-ghost" onclick="go({screen:'title'})">タイトルに戻る</button>
  </div>
  `;
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if(state.screen==="allc" && !allc) state.screen = "title";
  if(state.screen==="allresult" && !state.allSummary) state.screen = "title";
  if(state.screen==="title") html = renderTitle();
  else if(state.screen==="quiz"){
    if(quiz && quiz.format==="flag"){
      html = renderQuiz();
    }else if(GEO_LOAD_STATE==="loading") html = renderLoading();
    else if(GEO_LOAD_STATE==="error") html = renderError();
    else if(quiz) html = renderQuiz();
    else html = renderLoading();
  }
  else if(state.screen==="result") html = renderResult();
  else if(state.screen==="ranking") html = renderRanking();
  else if(state.screen==="mypage") html = renderMyPage();
  else if(state.screen==="explore") html = mapScreenGate(renderExplore);
  else if(state.screen==="allc") html = mapScreenGate(renderAllc);
  else if(state.screen==="allresult") html = renderAllResult();
  else html = renderLoading();

  app.innerHTML = html;

  if(state.screen!=="allc") stopAllcTimer();
  if(state.screen==="explore" && GEO_LOAD_STATE==="ready") setupExplore();
  if(state.screen==="allc" && allc && GEO_LOAD_STATE==="ready") setupAllc();

  if(state.screen==="quiz" && quiz){
    if(quiz.format==="map" && GEO_LOAD_STATE==="ready"){
      ensureMap();
      zoomToRegion(currentCountry());
      highlightAnswerOnMap(currentCountry());
    }
    if(quiz.answerMode==="typing"){
      const input = document.getElementById("answerInput");
      if(input){
        input.focus();
        input.addEventListener("input", ()=> input.classList.remove("wrong"));
        input.addEventListener("keydown", e=>{
          if(e.key==="Enter"){
            e.preventDefault();
            if(!quiz.answered) checkAnswer();
          }
        });
      }
      if(quiz.answered){
        const answerBtn = document.getElementById("answerBtn");
        if(answerBtn) answerBtn.disabled = true;
      }
      updateHintDisplay();
    }
    startLiveTimer();
  }
}

let liveTimerHandle = null;
function startLiveTimer(){
  if(liveTimerHandle) cancelAnimationFrame(liveTimerHandle);
  const el = document.getElementById("liveTimer");
  function tick(){
    if(!quiz || state.screen!=="quiz" || !el) return;
    if(!quiz.answered){
      const t = (performance.now()-quiz.qStartTime)/1000;
      el.textContent = t.toFixed(2)+"秒";
    }
    liveTimerHandle = requestAnimationFrame(tick);
  }
  tick();
}

function handleStart(diffKey, format){
  format = format || "map";
  if(format!=="map"){
    startQuiz(diffKey, format);
    return;
  }
  if(GEO_LOAD_STATE==="ready"){
    startQuiz(diffKey, "map");
    return;
  }
  pendingDifficulty = diffKey;
  pendingFormat = "map";
  go({ screen:"quiz" });
  loadGeoData();
}

/* ==================== INIT ==================== */
(function initPlayerNameBox(){
  const input = document.getElementById("playerNameInput");
  if(!input) return;
  input.value = PLAYER_NAME;
  input.addEventListener("input", ()=>{
    PLAYER_NAME = input.value;
    try{ localStorage.setItem("wcq_player_name", PLAYER_NAME); }catch(e){}
  });
})();
render();
loadGeoData();
</script>
</body>
</html>
